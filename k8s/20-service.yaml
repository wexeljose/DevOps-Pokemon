apiVersion: v1
kind: Service
metadata:
  name: devops-pokemon
  namespace: pokemon
  labels:
    app.kubernetes.io/name: devops-pokemon
    app.kubernetes.io/part-of: devops-pokemon
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: devops-pokemon
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30080
